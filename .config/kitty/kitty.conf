# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
allow_remote_control yes

# you can choose themes from $HOME/.config/kitty/kitty-themes/
include ./kitty-themes/gruvbox_dark.conf


#Cowboy shenanigans
#font_family      family="Rodeo CIES CAPS II"
#font_size        28
#modify_font      cell_width 100%
#modify_font      cell_height 100%
#symbol_map U+0020-U+0040,U+005B-U+0060,U+007B-U+007E JetBrains Mono

font_family FantasqueSansM Nerd Font Mono Bold
font_size 14.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.9
dynamic_background_opacity 1
confirm_os_window_close 0

# Animated cursor
cursor_trail 1

# change to x11 or wayland or leave auto
linux_display_server auto

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no

window_padding_width 4

#selection_foreground none
#selection_background none

#foreground #dddddd
#background #000000
#cursor #dddddd


# Increase / Decrease font size
map ctrl+plus change_font_size all +2.0
map ctrl+minus change_font_size all -2.0
map ctrl+0 change_font_size all 0


# BEGIN_KITTY_THEME
# Gruvbox Dark
include current-theme.conf
# END_KITTY_THEME
